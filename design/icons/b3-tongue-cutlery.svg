<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- B3. 혀 + 식기: 핀 뒤로 포크와 숟가락을 X자로 걸치고, 얼굴은 입 가로 70% 지점에서 혀를 내밀어 입맛 다시기 -->
  <rect width="512" height="512" rx="112" fill="#F7F2EA"/>
  <!-- 포크 (뒤, 오른쪽 위로 기울임) -->
  <g transform="rotate(32 256 256)" fill="#1F1A15">
    <rect x="236" y="34" width="9" height="56" rx="4.5"/>
    <rect x="252" y="34" width="9" height="56" rx="4.5"/>
    <rect x="268" y="34" width="9" height="56" rx="4.5"/>
    <path d="M236 84h41v12a21 21 0 0 1-14 20v346a7 7 0 0 1-14 0V116a21 21 0 0 1-13-20z"/>
  </g>
  <!-- 숟가락 (뒤, 왼쪽 위로 기울임) -->
  <g transform="rotate(-32 256 256)" fill="#1F1A15">
    <ellipse cx="256" cy="70" rx="24" ry="36"/>
    <path d="M249 98h14v364a7 7 0 0 1-14 0z"/>
  </g>
  <!-- 얼굴 핀 -->
  <path d="M256 84c-80 0-138 58-138 136 0 96 108 178 131 194a12 12 0 0 0 14 0c23-16 131-98 131-194 0-78-58-136-138-136z" fill="#C2461A"/>
  <circle cx="256" cy="222" r="88" fill="#FDFAF5"/>
  <path d="M210 204q15-17 30 0" fill="none" stroke="#1F1A15" stroke-width="12" stroke-linecap="round"/>
  <path d="M272 204q15-17 30 0" fill="none" stroke="#1F1A15" stroke-width="12" stroke-linecap="round"/>
  <path d="M252.3 258.8 C251.2 287.4 264.0 288.0 283.2 288.0 C302.3 288.0 296.0 269.6 294.9 241.0 Z" fill="#E8735A"/><path d="M252.3 258.8 C251.2 287.4 264.0 288.0 283.2 288.0 C302.3 288.0 296.0 269.6 294.9 241.0" fill="none" stroke="#1F1A15" stroke-width="9.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M275.5 256.7 L278.9 273.8" fill="none" stroke="#B9452F" stroke-width="5.6" stroke-linecap="round"/><path d="M212 236 Q256.0 282 300 236" fill="none" stroke="#1F1A15" stroke-width="12" stroke-linecap="round"/>
</svg>
